name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what development uses.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The suite is hermetic: no network and no SpiderAI key required.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built CLI starts
        run: node dist/index.js --help
